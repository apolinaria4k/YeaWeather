<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YeaWeather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div id="leftBlock" class="main__left">
          <form id="form" action="GET" class="main__form">
            <input
              id="input"
              class="main__input"
              type="text"
              placeholder="Saint-Petersburg"
            />
            <div id="search" class="form__search">
              <img class="search__icon" src="icons/search.png" alt="" />
            </div>
          </form>
          <div id="weather" class="left"></div>
        </div>

        <div class="main__right">
          <div id="forecast" class="right__text">
            <p class="today active" id="today">Today</p>
            <p class="tomorrow" id="tomorrow">Tomorrow</p>
          </div>
          <div id="properties" class="right__properties"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
